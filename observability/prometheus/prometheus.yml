global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    cluster: busreserve-cluster

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "busreserve-backend"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["backend:5000"]
        labels:
          service: "busreserve-api"
          tier: "backend"

  - job_name: "busreserve-nginx"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["nginx:80"]
        labels:
          service: "busreserve-ingress"
          tier: "proxy"
